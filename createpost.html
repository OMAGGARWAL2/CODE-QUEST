<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Post Notification</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Hind:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="CODEQUEST BOX LOGO.svg">
    <style>
        :root {
            --primary: #D92D20;
            --primary-hover: #B42318;
            --primary-soft: #FEF3F2;
            --text-main: #101828;
            --text-tertiary: #667085;
            --bg-body: #FFFFFF;
            --border: #EAECF0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        .site-header { height: 72px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .logo-container { display: flex; align-items: center; gap: 14px; cursor: pointer; text-decoration: none; }
        .logo-square { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-square img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text { font-size: 1.35rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; text-transform: uppercase; line-height: 1; font-family: 'Mulish', sans-serif; }
        .logo-text small { display: block; font-size: 0.7rem; font-weight: 700; color: var(--primary); letter-spacing: 0.8px; margin-top: 3px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-tertiary); text-decoration: none; font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 1rem; padding: 8px 14px; border-radius: 8px; }
        .back-link:hover { background: var(--primary-soft); color: var(--primary); }
        .avatar { width: 40px; height: 40px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 48px 28px 90px; }
        .page-title { font-family: 'Mulish', sans-serif; font-size: 2.4rem; font-weight: 800; color: #101828; margin-bottom: 6px; }
        .page-sub { font-size: 1.25rem; color: var(--text-tertiary); margin-bottom: 38px; }

        .form-group { margin-bottom: 28px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        label { display: block; font-family: 'Mulish', sans-serif; font-size: 1.1rem; font-weight: 700; color: #344054; margin-bottom: 10px; }
        input[type=text], input[type=number], select, textarea {
            width: 100%; padding: 15px 16px; border: 1.5px solid #d0d5dd; border-radius: 10px;
            font-size: 1.15rem; font-family: 'Hind', sans-serif; color: #101828; outline: none; background: #fff;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        textarea { min-height: 180px; resize: vertical; line-height: 1.6; }

        /* Custom image dropdown for Category */
        .cq-dd { position: relative; }
        .cq-dd-toggle { width: 100%; padding: 15px 16px; border: 1.5px solid #d0d5dd; border-radius: 10px; background: #fff; font-size: 1.15rem; font-family: 'Hind', sans-serif; color: #101828; display: flex; align-items: center; justify-content: space-between; cursor: pointer; outline: none; }
        .cq-dd-toggle:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        .cq-dd-cur { display: flex; align-items: center; gap: 12px; }
        .cq-dd-ico { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; flex: none; }
        .cq-dd-caret { color: #667085; font-size: 0.95rem; transition: transform 0.2s; }
        .cq-dd.open .cq-dd-caret { transform: rotate(180deg); }
        .cq-dd-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); padding: 6px; display: none; z-index: 60; }
        .cq-dd.open .cq-dd-menu { display: block; }
        .cq-dd-opt { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; cursor: pointer; font-family: 'Hind', sans-serif; font-size: 1.1rem; color: #101828; }
        .cq-dd-opt:hover { background: var(--primary-soft); }
        .cq-dd-opt.sel { background: #f2f4f7; font-weight: 700; }

        .att-preview { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
        .att-pill { display: inline-flex; align-items: center; gap: 10px; background: #f2f4f7; border-radius: 10px; padding: 9px 14px; font-size: 1rem; font-family: 'Mulish', sans-serif; color: #344054; }
        .att-pill button { border: none; background: transparent; color: #d32f2f; cursor: pointer; font-size: 1rem; }

        .actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 40px; }
        .btn { border: none; border-radius: 10px; padding: 15px 30px; font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
        .btn.ghost { background: #fff; color: #475467; border: 1.5px solid #d0d5dd; }
        .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.primary:hover { background: var(--primary-hover); }
        input[type=file] { display: none; }
        @media (max-width: 720px) { .form-row { grid-template-columns: 1fr; } .page-title { font-size: 1.9rem; } }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-left">
        <a href="recruiterindex.html" class="logo-container">
            <div class="logo-square"><img src="CODEQUEST BOX LOGO.svg" alt="CodeQuest"></div>
            <div class="logo-text">CodeQuest<small>Recruiter Portal</small></div>
        </a>
    </div>
    <div class="header-right"><div class="avatar"><img src="EXAMPAD/LINUX_TEST_CHITKARA_files/user-icon.3d6e2547.svg" alt="Profile"></div></div>
</header>

<div class="wrap">
    <h1 class="page-title" id="pageTitle">Post a Notification</h1>
    <p class="page-sub">Publish circulars, jobs and announcements to your students and teachers.</p>

    <form onsubmit="handleSavePost(event)">
        <input type="hidden" id="postId">
        <div class="form-row">
            <div class="form-group">
                <label for="pCompany">Company / Organisation</label>
                <input type="text" id="pCompany" placeholder="e.g. Google">
            </div>
            <div class="form-group">
                <label for="pCategory">Category</label>
                <div class="cq-dd" id="pCategoryDD">
                    <button type="button" class="cq-dd-toggle" onclick="toggleCatDD(event)">
                        <span class="cq-dd-cur"></span>
                        <i class="fas fa-chevron-down cq-dd-caret"></i>
                    </button>
                    <div class="cq-dd-menu" id="pCategoryMenu"></div>
                </div>
                <input type="hidden" id="pCategory" value="Circular">
            </div>
        </div>

        <div class="form-group">
            <label for="pTitle">Title</label>
            <input type="text" id="pTitle" placeholder="e.g. Hiring for SDE-1 (Batch 2024)" required>
        </div>

        <div class="form-group">
            <label for="pDesc">Description</label>
            <textarea id="pDesc" placeholder="Write the full details students and teachers will see…" required></textarea>
        </div>

        <div class="form-group">
            <label for="pAudience">Audience</label>
            <select id="pAudience">
                <option value="all">Everyone (students &amp; teachers)</option>
                <option value="students">Students only</option>
                <option value="teachers">Teachers only</option>
            </select>
        </div>

        <div class="form-group">
            <label>Attachments (PDF / docs / images)</label>
            <button type="button" class="btn ghost" onclick="document.getElementById('pFiles').click()"><i class="fas fa-paperclip"></i> Add files</button>
            <input type="file" id="pFiles" multiple onchange="handleFiles(this.files)">
            <div class="att-preview" id="pAttPreview"></div>
        </div>

        <div class="actions">
            <button type="button" class="btn ghost" onclick="location.href='recruiterindex.html'">Cancel</button>
            <button type="submit" class="btn primary"><i class="fas fa-paper-plane"></i> Publish</button>
        </div>
    </form>
</div>

<div class="toast-box" id="recToast" style="position:fixed;bottom:24px;right:24px;background:#101828;color:#fff;padding:14px 24px;border-radius:8px;display:none;z-index:100000;font-weight:600;font-family:'Mulish',sans-serif;">Done</div>

<script>
    const POSTS_KEY = 'CodeQuest_recruiter_posts';
    const MAX_FILE = 4 * 1024 * 1024;
    let pendingAtt = [];

    function readJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
    function getPosts() { return readJSON(POSTS_KEY, []); }
    function savePosts(v) { try { localStorage.setItem(POSTS_KEY, JSON.stringify(v)); return true; } catch (e) { toast('Storage full — attachment too large.'); return false; } }
    function esc(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function session() { return readJSON('CodeQuest_active_session', null) || readJSON('TESTPAD_current_user', {}); }

    // ===== CATEGORY IMAGE DROPDOWN (native <select> can't show <img>) =====
    const CATEGORIES = [
        { value: 'Circular', label: 'Circular', icon: 'OFFICIALCIRCULARS.png' },
        { value: 'Job', label: 'Job', icon: 'JOBSICONMAIN.png' },
        { value: 'Notice', label: 'Notice', icon: 'NOTIFICATIONBELLicon.png' },
        { value: 'Result', label: 'Result', icon: 'EXAMPAD/TESTPAD_WEBSITE__files/statistics.svg' }
    ];
    function catIcon(icon) { return `<img src="${icon}" class="cq-dd-ico" alt="">`; }
    function renderCatDD() {
        const menu = document.getElementById('pCategoryMenu');
        if (!menu) return;
        menu.innerHTML = CATEGORIES.map(c =>
            `<div class="cq-dd-opt" data-value="${c.value}" onclick="selectCat('${c.value}')">${catIcon(c.icon)}<span>${c.label}</span></div>`
        ).join('');
        setCat(document.getElementById('pCategory').value || 'Circular');
    }
    function setCat(val) {
        const c = CATEGORIES.find(x => x.value === val) || CATEGORIES[0];
        document.getElementById('pCategory').value = c.value;
        const cur = document.querySelector('#pCategoryToggle .cq-dd-cur') || document.querySelector('#pCategoryDD .cq-dd-cur');
        if (cur) cur.innerHTML = `${catIcon(c.icon)}<span>${c.label}</span>`;
        document.querySelectorAll('#pCategoryMenu .cq-dd-opt').forEach(o =>
            o.classList.toggle('sel', o.getAttribute('data-value') === c.value));
    }
    function toggleCatDD(e) { if (e) e.stopPropagation(); document.getElementById('pCategoryDD').classList.toggle('open'); }
    function selectCat(val) { setCat(val); document.getElementById('pCategoryDD').classList.remove('open'); }

    function handleFiles(files) {
        Array.from(files).forEach(f => {
            if (f.size > MAX_FILE) { toast(`"${f.name}" too large (max 4 MB).`); return; }
            const r = new FileReader();
            r.onload = () => { pendingAtt.push({ name: f.name, mime: f.type || '', size: f.size, url: r.result }); renderAttPreview(); };
            r.readAsDataURL(f);
        });
        document.getElementById('pFiles').value = '';
    }
    function renderAttPreview() { document.getElementById('pAttPreview').innerHTML = pendingAtt.map((a, i) => `<span class="att-pill">📎 ${esc(a.name)}<button type="button" onclick="pendingAtt.splice(${i},1);renderAttPreview()"><i class="fas fa-times"></i></button></span>`).join(''); }

    function handleSavePost(e) {
        e.preventDefault();
        const posts = getPosts();
        const id = document.getElementById('postId').value;
        const s = session();
        const data = {
            id: id || ('POST' + Date.now()),
            company: document.getElementById('pCompany').value.trim(),
            title: document.getElementById('pTitle').value.trim(),
            description: document.getElementById('pDesc').value.trim(),
            category: document.getElementById('pCategory').value,
            audience: document.getElementById('pAudience').value,
            attachments: pendingAtt.slice(),
            postedBy: s.email || s.name || 'recruiter',
            postedByName: s.name || 'Recruiter',
            createdAt: id ? (posts.find(p => p.id === id) || {}).createdAt || Date.now() : Date.now()
        };
        if (id) { const idx = posts.findIndex(p => p.id === id); if (idx >= 0) posts[idx] = data; else posts.push(data); }
        else posts.push(data);
        if (!savePosts(posts)) return;
        toast(id ? 'Notification updated.' : 'Notification published.');
        setTimeout(() => { location.href = 'recruiterindex.html'; }, 700);
    }

    function loadForEdit(id) {
        const p = getPosts().find(x => x.id === id); if (!p) return;
        document.getElementById('pageTitle').textContent = 'Edit Notification';
        document.getElementById('postId').value = p.id;
        document.getElementById('pCompany').value = p.company || '';
        document.getElementById('pTitle').value = p.title || '';
        document.getElementById('pDesc').value = p.description || '';
        setCat(p.category || 'Circular');
        document.getElementById('pAudience').value = p.audience || 'all';
        pendingAtt = (p.attachments || []).slice(); renderAttPreview();
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderCatDD();
        const id = new URLSearchParams(location.search).get('id');
        if (id) loadForEdit(id);
    });
    document.addEventListener('click', () => { const dd = document.getElementById('pCategoryDD'); if (dd) dd.classList.remove('open'); });
    function toast(msg) { const t = document.getElementById('recToast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._h); toast._h = setTimeout(() => t.style.display = 'none', 2500); }
</script>
</body>

</html>
